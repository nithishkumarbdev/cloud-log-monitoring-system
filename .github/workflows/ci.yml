name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r detector/requirements-dev.txt
      - run: pip install ruff mypy
      - run: ruff check detector alerting log-generator scripts
      - run: mypy detector --ignore-missing-imports
      - run: python -m pytest detector/tests alerting/tests -v
      - run: python scripts/smoke_test.py

  terraform-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt check
        run: terraform fmt -check -recursive infra/
      - name: terraform validate (aws)
        working-directory: infra/aws
        run: |
          terraform init -backend=false
          terraform validate
      - name: terraform validate (gcp)
        working-directory: infra/gcp
        run: |
          terraform init -backend=false
          terraform validate

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [terraform-lint, security-scan]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: terraform plan
        working-directory: infra/aws
        run: |
          terraform init
          terraform plan -no-color -out=tfplan | tee plan_output.txt
      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/aws/plan_output.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Terraform plan:\n\`\`\`\n${plan}\n\`\`\``
            });
